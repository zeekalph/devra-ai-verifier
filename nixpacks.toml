# nixpacks.toml – Force Python 3.12 for pandas compatibility
[phases.setup]
nixPkgs = ['python312']  # Use Python 3.12

[phases.build]
cmds = ['pip install --no-cache-dir torch==2.1.0+cpu torchvision==0.16.0+cpu --index-url https://download.pytorch.org/whl/cpu', 'pip install --no-cache-dir -r requirements.txt']

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"
